---
# Production secret validation shared by site.yml and deploy.yml pre_tasks.
#
# The application guards (PiiEncryptionProductionGuard,
# RememberMeKeyProductionGuard) already fail closed at startup. These tasks
# move the same failures earlier, before any server or application change, so
# operators get an actionable message instead of a failed service start after
# the playbook has reported deployment progress.
#
# A valid key is 32 random bytes encoded as canonical Base64, which is exactly
# 44 characters ending in one "=". That is what `openssl rand -base64 32`
# produces. Both keys are REQUIRED for the production profile; there is no
# bypass.

- name: Normalize production secret variables for validation
  ansible.builtin.set_fact:
    fasternet_validate_remember_me_key: "{{ app_remember_me_key | default('') | string | trim }}"
    fasternet_validate_encryption_key: "{{ document_encryption_key | default('') | string | trim }}"
  changed_when: false

- name: Validate app_remember_me_key is set (security)
  ansible.builtin.fail:
    msg: >-
      app_remember_me_key is required for the production deployment.
      Generate one with: openssl rand -base64 32
      Then set app_remember_me_key in group_vars/all.yml (never commit it).
  when: fasternet_validate_remember_me_key | length == 0

- name: Validate app_remember_me_key is not the development default (security)
  ansible.builtin.fail:
    msg: >-
      app_remember_me_key must not use the development default
      'dev-remember-me-key'. Generate one with: openssl rand -base64 32
      Then set app_remember_me_key in group_vars/all.yml (never commit it).
  when: fasternet_validate_remember_me_key == 'dev-remember-me-key'

- name: Validate app_remember_me_key is a Base64-encoded 32-byte key (security)
  ansible.builtin.fail:
    msg: >-
      app_remember_me_key must be a Base64-encoded 32-byte key
      (44 characters ending with one '='). Generate one with:
      openssl rand -base64 32
  when: fasternet_validate_remember_me_key is not match('^[A-Za-z0-9+/]{43}=$')

- name: Validate document_encryption_key is set (security)
  ansible.builtin.fail:
    msg: >-
      document_encryption_key is required for the production deployment.
      Generate one with: openssl rand -base64 32
      Then set document_encryption_key in group_vars/all.yml (never commit it).
  when: fasternet_validate_encryption_key | length == 0

- name: Validate document_encryption_key is a Base64-encoded 32-byte key (security)
  ansible.builtin.fail:
    msg: >-
      document_encryption_key must be a Base64-encoded 32-byte key
      (44 characters ending with one '='). Generate one with:
      openssl rand -base64 32
  when: fasternet_validate_encryption_key is not match('^[A-Za-z0-9+/]{43}=$')
